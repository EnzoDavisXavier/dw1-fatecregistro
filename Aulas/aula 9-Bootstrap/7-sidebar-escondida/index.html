<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="my-4 mx-4">
        <h3>Janela lateral</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam reiciendis maiores repellendus repellat nostrum aut ullam iure.</p>
        <button type="button" class="btn btn-secondary" data-bs-toggle="offcanvas" data-bs-target="#menu">Abrir</button>
    </div>

    <!-- a janela pode surgir do topo: offcanvas-top, direita: offcanvas-end, esquerda: offcanvas-start -->
    <div class="offcanvas offcanvas-end">
        <div class="offcanvas-header">
            <h1 class="offcanvas-title">Menu de opçoes</h1>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

</html>
